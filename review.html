<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecordU · 回顾</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="review-page">
  <div class="rv">
    <header class="rv-head">
      <div class="rv-brand-row">
        <div class="rv-brand-lockup">
          <img class="rv-logo" src="icons/icon48.png" alt="" width="36" height="36">
          <h1 class="rv-brand">RecordU</h1>
        </div>
        <a href="#" class="rv-export" id="rv-export">导出</a>
      </div>
      <div class="rv-toolbar">
        <nav class="rv-nav" aria-label="模式">
          <a href="#" class="rv-nav-link is-active" data-mode="queue">待回顾<span class="rv-nav-badge" data-badge="ideas" hidden aria-hidden="true"></span></a>
          <a href="#" class="rv-nav-link" data-mode="words">单词<span class="rv-nav-badge" data-badge="words" hidden aria-hidden="true"></span></a>
          <a href="#" class="rv-nav-link" data-mode="settings">设置</a>
        </nav>
        <div class="rv-toolbar-filters">
          <nav class="rv-view" aria-label="展示方式">
            <a href="#" class="rv-view-link is-active" data-view="queue">按时间</a>
            <a href="#" class="rv-view-link" data-view="site">按网站</a>
          </nav>
          <nav class="rv-range" aria-label="日期范围">
            <a href="#" class="rv-range-link is-active" data-range="week">本周</a>
            <a href="#" class="rv-range-link" data-range="earlier">更早</a>
            <a href="#" class="rv-range-link" data-range="all">全部</a>
          </nav>
        </div>
      </div>
      <p class="rv-progress" id="rv-progress">0 条</p>
    </header>

    <main id="rv-content" class="rv-content"></main>

    <div class="rv-empty hidden" id="rv-empty">
      <p class="rv-empty-text">没有待回顾的感触。</p>
    </div>
  </div>
  <script type="module" src="review/main.js"></script>
</body>
</html>
